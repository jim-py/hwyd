{% load static %}
<dialog id="chatDialog" class="modalActivity chat-dialog" aria-labelledby="chatTitle"
        data-messages-url="{% url 'chat:messages' %}" data-status-url="{% url 'chat:status' %}"
        data-read-url="{% url 'chat:read' %}">
    <div class="modal__header">
        <h3 id="chatTitle" class="dialog__title">Общий чат</h3>
        <form method="dialog">
            <button type="submit" class="chat-close" aria-label="Закрыть чат">
                <img src="{% static 'site/images/cansel.svg' %}" width="25" height="25" alt="">
            </button>
        </form>
    </div>
    <div id="chatMessages" class="chat-messages" role="log" aria-live="polite" aria-label="Сообщения общего чата" tabindex="0">
        <p id="chatEmpty">Сообщений пока нет.</p>
    </div>
    <form id="chatComposer" class="chat-composer">
        {% csrf_token %}
        <p id="chatError" class="chat-error" role="status" hidden></p>
        <div id="chatMode" class="chat-mode" hidden>
            <div><strong id="chatModeTitle"></strong><p id="chatModeText"></p></div>
            <button id="chatModeCancel" type="button" aria-label="Отменить ответ или редактирование">×</button>
        </div>
        <div class="chat-input-row">
            <textarea id="chatText" maxlength="2000" rows="1" placeholder="Сообщение..."
                      aria-label="Текст сообщения" required></textarea>
            <button id="chatEmojiToggle" class="button-6" type="button" aria-label="Выбрать emoji"
                    aria-expanded="false" aria-controls="chatEmojiPicker">😀</button>
            <button id="chatSend" class="button-save" type="submit" aria-label="Отправить сообщение" title="Отправить">
                <span id="chatSendLabel" hidden>Сохранить</span>
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false">
                    <path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>
        </div>
        <div id="chatEmojiPicker" class="chat-emoji-picker" role="group" aria-label="Emoji" hidden></div>
    </form>
    <div id="chatActionMenu" class="chat-action-menu" role="menu" aria-label="Действия с сообщением" hidden>
        <div id="chatActionChoices">
            <button type="button" role="menuitem" data-action="reply">Ответить</button>
            <button type="button" role="menuitem" data-action="edit">Изменить</button>
            <button type="button" role="menuitem" data-action="delete" class="chat-action--danger">Удалить</button>
        </div>
        <div id="chatDeleteConfirm" hidden>
            <p>Удалить сообщение?</p>
            <button type="button" role="menuitem" data-action="cancel-delete">Отмена</button>
            <button type="button" role="menuitem" data-action="confirm-delete" class="chat-action--danger">Удалить</button>
        </div>
    </div>
    <div class="chat-resize-handle" data-chat-resize="n" aria-hidden="true"></div>
    <div class="chat-resize-handle" data-chat-resize="e" aria-hidden="true"></div>
    <div class="chat-resize-handle" data-chat-resize="s" aria-hidden="true"></div>
    <div class="chat-resize-handle" data-chat-resize="w" aria-hidden="true"></div>
    <div class="chat-resize-handle" data-chat-resize="nw" aria-hidden="true"></div>
    <div class="chat-resize-handle" data-chat-resize="ne" aria-hidden="true"></div>
    <div class="chat-resize-handle" data-chat-resize="sw" aria-hidden="true"></div>
    <div class="chat-resize-handle" data-chat-resize="se" aria-hidden="true"></div>
</dialog>
