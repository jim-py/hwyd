{% load static %}
{% if not request.user_agent.is_mobile %}
    <link rel="stylesheet" href="{% static 'hwyd/css/layout-desktop.css' %}">
{% else %}
    <link rel="stylesheet" href="{% static 'hwyd/css/layout-mobile.css' %}">
{% endif %}
<style>
    :root {
        --habitus-background: {{ theme_palette.backgroundColor }};
        --habitus-head: {{ theme_palette.tableHeadColor }};
        --habitus-weekend: {{ theme_palette.tableHeadColorWeekend }};
        --habitus-head-text: {{ theme_palette.tableHeadTextColor }};
        --habitus-row-light: {{ theme_palette.rowColumnLight }};
    }

    body {
        vertical-align: middle;
        line-height: 1.5;
    }

</style>
<style>
    {# Выставление цвета фона и текста активности и её клеткам #}
    {% for activity in range_activities %}
        progress[id*="{{ forloop.counter0 }}-"]::-webkit-progress-value {
            background: {{ activity.backgroundColor }};
            border-radius: 2px;
            box-shadow: 0 1px 0 rgba(255, 255, 255, .3) inset;
        }
        div.on[id*="{{ forloop.counter0 }}-"], p[id*="p{{ forloop.counter0 }}"] {
            background-color: {{ activity.backgroundColor }};
            color: {{ activity.color }};
        }
    {% endfor %}

    progress.notFull::-webkit-progress-value {
        border-style: solid;
        border-color: #555;
        border-width: 0 1px 0 0;
    }

    {#p[id*=day] {#}
    {#    background-color: #ffdfdf;#}
    {#    text-align: center;#}
    {#    display: inline-block;#}
    {#    margin: 0;#}
    {#    width: 24px;#}
    {#    border-radius: 3px;#}
    {#    border: 1px solid black;#}
    {#    cursor: pointer;}#}
    {##}
    p.on {
        background-color: #ffffff;
    }

    p.headParagraph {
        background-color: var(--habitus-head);
        color: var(--habitus-head-text);
    }

    p.headParagraph.weekend {
        background-color: var(--habitus-weekend);
        color: var(--habitus-head-text);
    }

    body {
        background-color: var(--habitus-background);
    }

    progress.divClick {
        width: 25px;
        height: 25px;
    }

    .vertical.off {
        box-shadow: 0 0;
        border: 1px solid #ccc;
    }

    .vertical {
        {% if not settings.showTabs %}
        transform: rotate(-90deg);
        {% endif %}
        border: 1px solid #555;
        box-shadow: -1px 0 1px rgba(100, 100, 100, .3);
        border-radius: 3px;
    }

    .progress-bar {
        border-radius: 2px;
        box-shadow: -1px 0 0 rgba(255, 255, 255, .3) inset;
        transition: all 0.25s ease-out;

        {% if settings.showTabs %}
        display: flex;
        font-size: 11px;
        justify-content: center;
        flex-flow: column wrap;
        align-items: center;
        color: #979797;
        {% endif %}
    }

    .progress-bar.notFull {
        border-style: solid;
        border-color: #555;
        border-width: 0 1px 0 0;
        box-shadow: 0 0;
    }

    {# Подсветка строки и колонки при наведении на клетку #}
    {% if settings.showRowColumnLight %}
        .table {
            overflow: hidden;
        }

        .table th, .table td {
            position: relative;
            transition: 0.3s;
        }

        .table td:not(.activity-delete-cell):not(:has(p)):hover:before {
            background-color: var(--habitus-row-light);
            content: '';
            height: 100%;
            left: -5000px;
            position: absolute;
            top: 0;
            width: 10000px;
            z-index: -2;
        }

        .table td:not(.activity-delete-cell):not(:has(p)):hover:after {
            background-color: var(--habitus-row-light);
            content: '';
            height: 10000px;
            left: 0;
            position: absolute;
            top: -5000px;
            width: 100%;
            z-index: -1;
        }
    {% endif %}

    {# Подсвечивает день и активность при наведении на клетку #}
    {% if settings.showActivityDayLight %}
        .table tr:has(> td:not(.activity-delete-cell):hover) td.header > p {
            box-shadow: 0 0 3px -1px rgb(0, 0, 0) inset;
            border: 1px solid black;
        }
    {% endif %}
</style>
<link rel="stylesheet" href="{% static 'hwyd/css/tooltips.css' %}?v=20261006-cell-comments">
<style>
{% if not request.user_agent.is_mobile %}
        .activity-dialog {
            left: clamp(16px, 40%, calc(100% - 356px));
        {#top: 25%;#} padding: 0;
        }
    {% endif %}
</style>
<link rel="stylesheet" href="{% static 'hwyd/css/sortable.css' %}">
<link rel="stylesheet" href="{% static 'hwyd/css/theme-schedule.css' %}">
