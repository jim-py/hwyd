{% load static %}
<div id="notif-modal" class="notif-modal" role="dialog" aria-modal="true" aria-hidden="{% if notification_preview %}false{% else %}true{% endif %}" aria-labelledby="notif-title"
  data-notif-id="{{ unread_notification.id }}">
  <div class="notif-modal__dialog">
    <header class="notif-modal__header">
      <h3 id="notif-title">{{ unread_notification.title|default:"Уведомление" }}</h3>
      {% include 'includes/modal_close.html' with label='Закрыть уведомление' button_id='notif-close' extra_class='notif-close' only %}
    </header>
    <div class="notif-modal__body">
      {{ unread_notification.message|safe }}
    </div>
    <footer class="notif-modal__footer">
      <button type="button" id="notif-ok" class="notif-btn">ОК</button>
    </footer>
  </div>
</div>
