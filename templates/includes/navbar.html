{% load static %}
{% with page=request.resolver_match.url_name %}
<nav class="nav-menu">
    <ul class="nav-menu__list">
        <li class="nav-menu__item{% if page == 'home' %} nav-menu__item--active{% endif %}">
            <a href="{% url 'home' %}" class="nav-menu__link" data-section="home" title="Главная" aria-label="Главная"{% if page == 'home' %} aria-current="page"{% endif %}><i class="fa-solid fa-house" aria-hidden="true"></i></a>
        </li>
        {% if user.is_authenticated %}
        <li class="nav-menu__item{% if request.path|slice:':9' == '/habitus/' %} nav-menu__item--active{% endif %}">
            <a href="{% url 'index' %}" class="nav-menu__link" data-section="habitus" title="Habitus" aria-label="Habitus"{% if request.path|slice:':9' == '/habitus/' %} aria-current="page"{% endif %}><i class="fa-solid fa-calendar-days" aria-hidden="true"></i></a>
        </li>
        <li class="nav-menu__item{% if page == 'profile' %} nav-menu__item--active{% endif %}">
            <a href="{% url 'profile' %}" class="nav-menu__link" data-section="profile" title="Profile" aria-label="Профиль"{% if page == 'profile' %} aria-current="page"{% endif %}><i class="fa-solid fa-user" aria-hidden="true"></i></a>
        </li>
        {% endif %}
        {% if not user.is_authenticated %}
        <li class="nav-menu__item{% if page == 'entry' and type_form == 'register' %} nav-menu__item--active{% endif %}">
            <a href="{% url 'entry' %}?type=register" class="nav-menu__link" data-section="register" title="Register" aria-label="Регистрация"{% if page == 'entry' and type_form == 'register' %} aria-current="page"{% endif %}><i class="fa-solid fa-user-plus" aria-hidden="true"></i></a>
        </li>
        <li class="nav-menu__item{% if page == 'entry' and type_form != 'register' %} nav-menu__item--active{% endif %}">
            <a href="{% url 'entry' %}?type=login" class="nav-menu__link" data-section="login" title="Log in" aria-label="Вход"{% if page == 'entry' and type_form != 'register' %} aria-current="page"{% endif %}><i class="fa-solid fa-right-to-bracket" aria-hidden="true"></i></a>
        </li>
        {% endif %}
        <li class="nav-menu__item{% if page == 'about' %} nav-menu__item--active{% endif %}">
            <a href="{% url 'about' %}" class="nav-menu__link" data-section="about" title="Info" aria-label="О проекте"{% if page == 'about' %} aria-current="page"{% endif %}><i class="fa-solid fa-circle-info" aria-hidden="true"></i></a>
        </li>
        {% if is_habitus_page %}
        <li class="nav-menu__item">
            <button id="buttonSettings" type="button" class="nav-menu__link" title="Настройки" aria-label="Настройки" aria-controls="some-modal-id" onclick="document.getElementById('some-modal-id').showModal();"><i class="fa-solid fa-gear" aria-hidden="true"></i></button>
        </li>
        {% endif %}
        {% if public_theme %}
        <li class="nav-menu__item" hidden data-public-theme-item>
            <button type="button" class="nav-menu__link public-theme-control" data-public-theme-control>
                <i class="fa-solid fa-circle-half-stroke" aria-hidden="true"></i><span data-public-theme-label>Авто</span>
            </button>
        </li>
        {% endif %}
    </ul>
</nav>
{% endwith %}
